name: Верифікатор

# Брама Лаб. 2 (крок 03): суддя на іншій моделі (OpenAI) звіряє diff пул-реквесту
# з критеріями приймання docs/lab2/spec.md. Червоний = fail хоча б по одному критерію = не зливати.
on:
  pull_request:
    branches: [main]

concurrency:
  group: verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Верифікатор (gpt-5.6-terra проти spec.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Встановлення залежностей
        run: npm ci

      - name: Diff пул-реквесту
        run: git diff "origin/${{ github.base_ref }}...HEAD" > docs/lab2/verify-input.diff

      - name: Верифікатор
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VERIFY_MODEL: gpt-5.6-terra
        run: npx tsx scripts/verify.ts docs/lab2/verify-input.diff --json verify-report.json

      - name: Звіт верифікатора як артефакт
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: verify-report.json
          if-no-files-found: ignore
